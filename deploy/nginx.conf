# Web server settings for the ILC portal website (the built `dist` folder), with the security headers.
# Used by the Dockerfile as a template: nginx fills in ${API_ORIGIN} (e.g. https://api-dev.indialeadershipcouncil.com)
# and ${API_WS_ORIGIN} (e.g. wss://api-dev.indialeadershipcouncil.com) when it starts. Set them in Dokploy.

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;                      # do not announce the server version
  client_max_body_size 1m;                # the website takes no uploads itself (files go to the API)

  # ---- security headers (sent with every answer) ----
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' ${API_ORIGIN} ${API_WS_ORIGIN} https://*.amazonaws.com; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
  add_header X-Frame-Options "DENY" always;                         # never shown inside another site (clickjacking)
  add_header X-Content-Type-Options "nosniff" always;               # files are only what they say they are
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # https only, for a year
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Built files have a fingerprint in their name: they can be kept a long time.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Never serve hidden files (.env, .git) even if one ends up in the folder by mistake.
  location ~ /\. {
    deny all;
    return 404;
  }

  # Every other address opens the app (it has its own pages); index.html is never cached, so updates show at once.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' ${API_ORIGIN} ${API_WS_ORIGIN} https://*.amazonaws.com; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }
}
